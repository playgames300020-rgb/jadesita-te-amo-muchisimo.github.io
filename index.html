<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Para mi princesa ❤️</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
height:100vh;
overflow:hidden;
background:black;
}
#pantalla1{
background:linear-gradient(135deg,#ff1744,#ff4d6d,#ff758f);
}
@keyframes fondo{
0%{background-position:0% 50%;}
50%{background-position:100% 50%;}
100%{background-position:0% 50%;}
}

.pantalla{
position:absolute;
top:0;
left:0;
width:100%;
height:100%;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
transition:1s;
}

.oculta{
display:none !important;
opacity:0;
pointer-events:none;
}

h1{
color:white;
font-size:42px;
margin-bottom:40px;
text-shadow:0 0 15px deeppink;
text-align:center;
}

.botones{
position:relative;
width:320px;
height:120px;
}

button{
padding:15px 35px;
font-size:20px;
border:none;
border-radius:40px;
cursor:pointer;
transition:.3s;
}

button:hover{
transform:scale(1.08);
}

#si{
background:#ff2d75;
color:white;
}

#no{
background:white;
color:#ff2d75;
position:absolute;
right:0;
}

#pantalla2{
background:linear-gradient(135deg,#1e3c72,#2a5298,#4facfe);
}

#sobre{
position:relative;
width:360px;
height:240px;
cursor:pointer;
filter:drop-shadow(0 15px 20px rgba(0,0,0,.35));
}

.cuerpo{
position:absolute;
bottom:0;
width:100%;
height:170px;
background:linear-gradient(#ff7eb3,#ff4f8b);
border-radius:0 0 18px 18px;
}

.tapa{
position:absolute;
width:0;
height:0;
border-left:180px solid transparent;
border-right:180px solid transparent;
border-top:120px solid #ff9fc7;
transform-origin:top;
transition:1s;
z-index:5;
}

.abrir .tapa{
transform:rotateX(180deg);
}

.corazon{
position:absolute;
left:50%;
top:120px;
transform:translateX(-50%);
font-size:40px;
z-index:6;
}

.textoSobre{
position:absolute;
bottom:18px;
width:100%;
text-align:center;
font-size:24px;
font-weight:bold;
color:white;
z-index:6;
}

#pantalla3{
background:linear-gradient(135deg,#ff4d6d,#7b68ee,#4facfe);
overflow:hidden;

display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
}
#carta{
width:600px;
min-height:520px;
background:white;

padding:30px;

border-radius:20px;

box-shadow:0 20px 40px rgba(0,0,0,.35);

position:relative;

z-index:100;

opacity:0;

transform:translateY(100px) scale(.8);

transition:1s;
}
#carta::before{
content:"❤️";
position:absolute;
right:20px;
top:15px;
font-size:28px;
}

.mostrarCarta{
opacity:1;
transform:translateY(0) scale(1);
}

#carta h2{
text-align:center;
color:#d81b60;
margin-bottom:15px;
}

#dias{
text-align:center;
color:#ff2d75;
margin-bottom:20px;
}

#mensaje{
font-size:19px;
line-height:1.8;
text-align:justify;
white-space:pre-line;
}

#final{
margin-top:25px;
background:#ff2d75;
color:white;
width:100%;
}

.corazonFlotante{
position:absolute;
font-size:25px;
animation:subir linear infinite;
opacity:.5;
}

@keyframes subir{

0%{
transform:translateY(100vh);
opacity:0;
}

20%{
opacity:.7;
}

100%{
transform:translateY(-120vh);
opacity:0;
}

}

</style>

</head>

<body>

<!-- ======== PANTALLA 1 ======== -->

<div id="pantalla1" class="pantalla">

<h1>¿Sabes que te amo mucho? ❤️</h1>

<div class="botones">

<button id="si">Sí 💖</button>

<button id="no">No 😢</button>

</div>

</div>

<!-- ======== PANTALLA 2 ======== -->

<div id="pantalla2" class="pantalla oculta">

<h1>Tengo algo para ti ❤️</h1>

<div id="sobre">

<div class="tapa"></div>

<div class="cuerpo"></div>

<div class="corazon">❤️</div>

<div class="textoSobre">
Para mi novia
</div>

</div>

</div>

<!-- ======== PANTALLA 3 ======== -->

<div id="pantalla3" class="pantalla oculta">

<h1>💖 Una carta para ti 💖</h1>

<div id="carta">

<h2>Para mi novia ❤️</h2>

<h3 id="dias"></h3>

<p id="mensaje"></p>

<button id="final">
💜 Te amo muchísimo 💜
</button>

</div>

</div>

<!-- Música (la agregaremos después) -->

<script>

// ========= ELEMENTOS =========

const pantalla1 = document.getElementById("pantalla1");
const pantalla2 = document.getElementById("pantalla2");
const pantalla3 = document.getElementById("pantalla3");

const musica = document.getElementById("musica");

const btnSi = document.getElementById("si");
const btnNo = document.getElementById("no");

const sobre = document.getElementById("sobre");

const carta = document.getElementById("carta");

const mensaje = document.getElementById("mensaje");

const dias = document.getElementById("dias");

const musica = document.getElementById("musica");

// ========= BOTÓN NO =========

btnNo.onclick = function(){

let x = Math.random()*(window.innerWidth-150);

let y = Math.random()*(window.innerHeight-100);

btnNo.style.position="fixed";

btnNo.style.left=x+"px";

btnNo.style.top=y+"px";

}

// ========= BOTÓN SI =========

btnSi.onclick=function(){

musica.play();

pantalla1.style.opacity="0";

setTimeout(()=>{

pantalla1.style.display="none";

pantalla2.classList.remove("oculta");
pantalla2.style.display="flex";

setTimeout(()=>{

pantalla2.style.opacity="1";

},100);

},700);

}

// ========= SOBRE =========

sobre.onclick=function(){

sobre.classList.add("abrir");

setTimeout(()=>{

pantalla2.style.opacity="0";

setTimeout(()=>{

pantalla2.style.display="none";

pantalla3.classList.remove("oculta");

pantalla3.style.display="flex";

setTimeout(()=>{

pantalla3.style.opacity="1";

carta.style.display="block";
carta.style.opacity="1";
carta.style.transform="translateY(0) scale(1)";

carta.classList.add("mostrarCarta");

escribir();
},100);

},700);

},900);

}

// ========= CONTADOR =========

// Del 17 de enero al 1 de agosto

dias.innerHTML="❤️ Han pasado 196 días desde aquel 17 de enero ❤️";

// ========= MENSAJE =========

const texto=`Feliz día de la novia a la mejor novia del mundo

Te amo muchísimo. ❤️`;

let i=0;

function escribir(){

if(i<texto.length){

mensaje.innerHTML+=texto.charAt(i);

i++;

setTimeout(escribir,40);

}

}

// ========= CORAZONES =========

const colores=["❤️","💙","🩵"];

for(let i=0;i<50;i++){

let c=document.createElement("div");

c.className="corazonFlotante";

c.innerHTML=colores[Math.floor(Math.random()*3)];

c.style.left=Math.random()*100+"vw";

c.style.fontSize=(18+Math.random()*20)+"px";

c.style.animationDuration=(5+Math.random()*5)+"s";

c.style.animationDelay=Math.random()*5+"s";

document.body.appendChild(c);

}

// ========= BOTÓN FINAL =========

document.getElementById("final").onclick=function(){

alert("❤️ Gracias por existir.\n\nEres la mejor parte de mi vida.\n\nTe amo infinitamente. 💜");

}

</script>

<audio id="musica" loop>
    <source src="Los Auténticos Decadentes - Loco (Tu Forma De Ser) (Official Audio).mp3" type="audio/mpeg">
</audio>

</body>
</html>
